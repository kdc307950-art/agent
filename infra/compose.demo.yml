name: langgraph-demo

# 一条命令跑起完整演示栈（后端 + 种子数据 + Nginx 托管前端）：
#
#   docker compose -f infra/compose.demo.yml up --build
#
# 与 compose.dev.yml 的分工：
#   - compose.dev.yml  开发时用的依赖栈（含 Prometheus / Jaeger / Grafana），应用跑在宿主机
#   - compose.demo.yml 应用、种子数据、前端都在容器里，只暴露 8000 一个端口
#
# 刻意的取舍：
#   1. 不暴露 5432 / 6379 到宿主机。demo 只需要 8000。
#   2. 密码是写死的弱口令。容器不对外暴露端口，数据卷匿名，down -v 即消失。任何联网环境都不要用这份文件。
#   3. DEEPSEEK_API_KEY 允许缺省。缺省时系统可建单/分类/追问/派单，知识建议为空并转人工。
#   4. 开发令牌不写入镜像：前端从 sessionStorage 读取用户在页面粘贴的短期令牌。

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: langgraph
      POSTGRES_USER: langgraph
      POSTGRES_PASSWORD: demo_only_not_a_secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langgraph -d langgraph"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # 建表是一次性任务，不是应用启动的一部分。
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["python", "-m", "backend.migrations"]
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql://langgraph:demo_only_not_a_secret@postgres:5432/langgraph
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-demo-placeholder-key}
      TENANT_TOKEN_SECRET: demo_only_not_a_secret
    depends_on:
      postgres:
        condition: service_healthy

  # 种子数据：一次性任务，agent 等待 seed 成功后才会启动，保证打开页面即有数据。
  seed:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["python", "-m", "backend.seed_demo"]
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql://langgraph:demo_only_not_a_secret@postgres:5432/langgraph
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-demo-placeholder-key}
      TENANT_TOKEN_SECRET: demo_only_not_a_secret
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  agent:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      AUTH_MODE: dev
      DATABASE_URL: postgresql://langgraph:demo_only_not_a_secret@postgres:5432/langgraph
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_BACKEND: redis
      LANGGRAPH_AUTO_SETUP: "false"
      TENANT_TOKEN_SECRET: demo_only_not_a_secret
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-demo-placeholder-key}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).status==200 else 1)"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully

  # 前端：Nginx 托管静态文件，/api/* 去掉 /api 前缀后代理给 agent。
  # 外部只暴露 127.0.0.1:8000（web），agent 不再对宿主机开端口。
  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:80"
    depends_on:
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
