#[核心]项目配置和依赖声明文件
[project]
name = "langgraph-demo"
version = "0.1.0"
description = "LangGraph Agent Demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-openai>=0.1.0",
    "python-dotenv>=1.0.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.3",
    "sse-starlette>=3.4.8",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary,pool]>=3.3.4",
    "redis[hiredis]>=5.0",
    "pyjwt[crypto]>=2.8",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
