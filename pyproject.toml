#[核心]项目配置和依赖声明文件
[project]
name = "langgraph-demo"
version = "0.1.0"
description = "LangGraph Agent Demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 依赖版本策略（收敛方案阶段五）：以 uv.lock 已验证版本为基线（langgraph 1.2.11 /
    # langchain 1.3.17 / langchain-openai 1.5.1），设兼容上限；每次升级核心包须
    # `uv lock --upgrade-package <pkg>` + 全量 pytest + 最小兼容性测试通过后提交。
    "langgraph>=0.2.0,<2.0",
    "langchain>=1.0.0,<2.0",
    "langchain-openai>=0.1.0,<2.0",
    "python-dotenv>=1.0.0",
    "langgraph-checkpoint-sqlite>=3.1.1,<4.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.3",
    "sse-starlette>=3.4.8",
    "langgraph-checkpoint-postgres>=3.1.2,<4.0",
    "psycopg[binary,pool]>=3.3.4",
    "redis[hiredis]>=5.0",
    "pyjwt[crypto]>=2.8",
    "cryptography>=42.0",
    "httpx>=0.27",
    "jieba>=0.42.1",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-exporter-prometheus>=0.65b0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "black>=24.0.0",
    "mypy>=1.11.0",
    "pre-commit>=3.7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "live_e2e: tests that call a real model endpoint and may incur provider cost",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "workflows"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]  # B008: FastAPI 惯用法 Depends()/Query() 作参数默认值，全项目一致

[tool.ruff.lint.isort]
known-first-party = ["backend", "src"]

[tool.black]
target-version = ["py311"]
line-length = 100
exclude = "(\\.venv/|workflows/|frontend/)"

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = "(^|/)(tests|workflows)/"

[[tool.mypy.overrides]]
module = ["jieba.*"]
ignore_missing_imports = true
