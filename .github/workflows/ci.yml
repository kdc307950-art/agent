name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      APP_ENV: test
      DEEPSEEK_API_KEY: test-key
      TENANT_TOKEN_SECRET: test-tenant-secret
      AUTH_MODE: dev
      DATABASE_URL: postgresql://langgraph:langgraph@127.0.0.1:5432/langgraph
      TEST_DATABASE_URL: postgresql://langgraph:langgraph@127.0.0.1:5432/langgraph
      REDIS_URL: redis://127.0.0.1:6379/0
      RATE_LIMIT_BACKEND: redis
      REDIS_FAIL_MODE: closed
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: langgraph
          POSTGRES_USER: langgraph
          POSTGRES_PASSWORD: langgraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U langgraph -d langgraph"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Install dependencies
        run: uv sync --locked
      - name: Initialize PostgreSQL schema
        run: uv run python -m backend.migrations
      - name: Run Python tests
        run: uv run pytest -q
      - name: Build frontend
        run: npm --prefix frontend ci && npm --prefix frontend run build
