name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      APP_ENV: test
      DEEPSEEK_API_KEY: test-key
      TENANT_TOKEN_SECRET: test-tenant-secret
      AUTH_MODE: dev
      DATABASE_URL: postgresql://langgraph:langgraph@127.0.0.1:5432/langgraph
      TEST_DATABASE_URL: postgresql://langgraph:langgraph@127.0.0.1:5432/langgraph
      REDIS_URL: redis://127.0.0.1:6379/0
      RATE_LIMIT_BACKEND: redis
      REDIS_FAIL_MODE: closed
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: langgraph
          POSTGRES_USER: langgraph
          POSTGRES_PASSWORD: langgraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U langgraph -d langgraph"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Install dependencies
        run: uv sync --locked
      - name: Initialize PostgreSQL schema
        # 空库上这一步应在数秒内完成。加超时是因为它的历史故障模式是**无限挂起**
        # 而不是报错（持锁连接的隐式事务阻塞 CREATE INDEX CONCURRENTLY，
        # 见 backend/migrations.py）；没有超时的话会耗尽整个 job 的时限才失败。
        timeout-minutes: 3
        run: uv run python -m backend.migrations
      - name: Initialize pgvector schema
        env:
          KNOWLEDGE_EMBEDDING_DIMENSION: "8"
        run: uv run python -m backend.vector_migrations
      - name: Seed demo data (idempotent)
        run: uv run python -m backend.seed_demo
      - name: Run V1 ticket eval with real PostgreSQL retrieval
        # 真实检索评测：引用支撑率与 ACL 泄露只在 db 模式计算；不达标即失败。
        run: >-
          uv run python -m backend.run_ticket_eval
          --json docs/evaluation/ticket-eval-report.json
          --require-db
          --fail-under-classification 0.9
          --fail-under-field-rate 0.95
          --fail-under-reference 1.0
          --max-acl-leaks 0
      - name: Validate demo compose config
        run: docker compose -f infra/compose.demo.yml config -q
      - name: Lint with ruff
        run: uv run ruff check .
      - name: Format check with black
        run: uv run black --check .
      - name: Type check with mypy
        run: uv run mypy backend src
      - name: Run Python tests
        run: uv run pytest -q
      - name: Frontend lint
        run: npm --prefix frontend run lint
      - name: Frontend unit tests
        run: npm --prefix frontend test -- --run
      - name: Build frontend
        run: npm --prefix frontend ci && npm --prefix frontend run build
      - name: Build backend image
        # infra/k8s 的清单引用的镜像必须真的构建得出来，否则那套部署配置
        # 只是一份没被验证过的文档。这一步让 Dockerfile 的腐化在 CI 就暴露。
        # uv 二进制源默认 ghcr.io；网络受限的自建 runner 可在仓库设置里配置
        # UV_IMAGE 仓库变量指向可信镜像站，例如 ghcr.nju.edu.cn/astral-sh/uv:0.11。
        run: docker build --build-arg UV_IMAGE="${{ vars.UV_IMAGE || 'ghcr.io/astral-sh/uv:0.11' }}" -t langgraph-agent:ci .
