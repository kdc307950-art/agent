name: OIDC Staging Agent E2E

on:
  workflow_dispatch:

concurrency:
  group: oidc-staging-e2e
  cancel-in-progress: true

jobs:
  oidc-staging-e2e:
    runs-on: ubuntu-latest
    environment: oidc-staging
    env:
      CI: "true"
      APP_ENV: staging
      RUN_LIVE_E2E: "true"
      LIVE_AGENT_BASE_URL: http://127.0.0.1:8000
      LIVE_AGENT_TOKEN: ${{ secrets.OIDC_STAGING_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.deepseek.com' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'deepseek-chat' }}
      AUTH_MODE: oidc
      OIDC_ISSUER_URL: ${{ vars.OIDC_ISSUER_URL }}
      OIDC_AUDIENCE: ${{ vars.OIDC_AUDIENCE }}
      OIDC_JWKS_URL: ${{ vars.OIDC_JWKS_URL }}
      OIDC_TENANT_CLAIM: ${{ vars.OIDC_TENANT_CLAIM || 'tenant_id' }}
      OIDC_REQUIRED_SCOPES: chat:write
      OIDC_REQUIRE_JTI: "true"
      OIDC_MAX_TOKEN_AGE_SECONDS: "3600"
      OIDC_REVOCATION_MODE: redis
      DATABASE_URL: postgresql://langgraph:langgraph@127.0.0.1:5432/langgraph
      TEST_DATABASE_URL: postgresql://langgraph:langgraph@127.0.0.1:5432/langgraph
      REDIS_URL: redis://127.0.0.1:6379/0
      RATE_LIMIT_BACKEND: redis
      REDIS_FAIL_MODE: closed
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173
      # 必须与 pgvector 列的维度一致，避免运行期向量写入失败。
      KNOWLEDGE_EMBEDDING_DIMENSION: "8"
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: langgraph
          POSTGRES_USER: langgraph
          POSTGRES_PASSWORD: langgraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U langgraph -d langgraph"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate OIDC staging configuration
        run: |
          set -euo pipefail
          missing=()
          for name in DEEPSEEK_API_KEY OIDC_STAGING_TOKEN OIDC_ISSUER_URL OIDC_AUDIENCE OIDC_JWKS_URL; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::oidc-staging is missing: ${missing[*]}"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Install dependencies
        run: uv sync --locked
      - name: Initialize PostgreSQL schema
        # 见 ci.yml 同名步骤：该命令的历史故障模式是无限挂起而非报错
        timeout-minutes: 3
        run: uv run python -m backend.migrations
      - name: Initialize pgvector schema
        run: uv run python -m backend.vector_migrations
      - name: Start agent
        run: |
          set -euo pipefail
          nohup uv run uvicorn backend.app:app --host 127.0.0.1 --port 8000 --log-level info > agent.log 2>&1 &
          echo $! > agent.pid
      - name: Wait for real OIDC readiness
        run: |
          set -u
          for i in {1..45}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/readyz; then
              exit 0
            fi
            if [ -f agent.pid ] && ! kill -0 "$(cat agent.pid)" 2>/dev/null; then
              echo "Agent process exited before OIDC readiness became available."
              cat agent.log
              exit 1
            fi
            sleep 2
          done
          echo "Timed out waiting for real OIDC readiness."
          ps -ef | grep -E '[u]vicorn|[p]ython' || true
          cat agent.log
          exit 1
      - name: Run live OIDC E2E
        run: uv run pytest tests/e2e/test_live_deepseek.py -q
      - name: Upload agent log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oidc-staging-agent-log
          path: agent.log
          if-no-files-found: ignore
